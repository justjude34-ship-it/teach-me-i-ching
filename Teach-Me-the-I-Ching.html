<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#000000"/>
<title>Teach Me the I Ching</title>
<style>body{margin:0;background:#000000;color:#f5f0e8;font:16px system-ui;display:grid;place-items:center;min-height:100dvh;text-align:center;padding:24px}</style>
</head><body>
<p id="s">Loading Teach Me the I Ching…</p>
<p style="opacity:.6;font-size:.8rem;max-width:28rem">If this stays blank on <code>file://</code>, open the single-file copy from local artifacts / Gumroad zip (<code>Teach-Me-the-I-Ching.html</code> self-contained).</p>
<script>
(async () => {
  try {
    const parts = await Promise.all([0,1,2,3,4].map(i => fetch("parts/b64-" + i + ".txt").then(r => {
      if (!r.ok) throw new Error("missing parts/b64-" + i + ".txt");
      return r.text();
    })));
    const bin = Uint8Array.from(atob(parts.join("")), c => c.charCodeAt(0));
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("s").innerHTML = "Could not load app parts.<br><small>" + e + "</small><br><br>Use the single-file HTML from local artifacts for offline / Gumroad.";
  }
})();
</script>
</body></html>
