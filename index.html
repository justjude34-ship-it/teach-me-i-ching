<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#000000"/>
<title>Teach Me the I Ching</title>
<style>
:root{--bg:#000000;--card:#141414;--text:#f6f6f6;--muted:#a3a3a3;--gold:#ff2bd6;--sage:#ff9adf;--line:#f6f6f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,sans-serif}
header,main{max-width:640px;margin:0 auto;padding:16px}
header{padding-bottom:0}
.hero{position:relative;margin:0 0 14px;border-radius:16px;overflow:hidden;border:1px solid #ff2bd6;box-shadow:0 0 0 1px rgba(255,43,214,.35),0 0 28px rgba(255,43,214,.32);line-height:0}
.hero img{display:block;width:100%;height:auto}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,#000);pointer-events:none}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
nav{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:2}
button,select{font:inherit;color:var(--text);background:var(--card);border:1px solid #3a3a3a;border-radius:12px;min-height:44px;padding:8px 14px}
nav button.active,button.primary{background:var(--gold);color:#000;border-color:var(--gold);font-weight:650}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 12px}
h2{font-size:1.25rem;margin:0 0 8px}
.muted{color:var(--muted)}
.tri{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tri div{background:#000;border-radius:12px;padding:10px}
.bars{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;margin:12px 0}
.bar{height:10px;width:140px;background:var(--line);border-radius:3px}
.bar.yin{background:transparent;display:flex;justify-content:space-between}
.bar.yin i{display:block;width:62px;height:10px;background:var(--line);border-radius:3px}
.bar.chg{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.grow{flex:1}
.coins{display:flex;gap:8px;justify-content:center;margin:8px 0}
.coin{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.coin.h{background:var(--sage);color:#000}
.coin.t{background:#2a2a2a}
ol{padding-left:1.2rem}
li{margin:6px 0}
.hide{display:none}
</style>
</head>

["What it is","The I Ching, the Book of Changes, is an old Chinese book of situations. It does not tell you what will happen. It gives a picture of the moment and a way to meet it. A reading is six lines. You read the picture, then only the lines that are changing."],
["Yin and yang","A solid line is yang: active, firm, outward. A broken line is yin: open, receptive, inward. Neither is better. Change happens when they stack."],
["Eight trigrams","Three lines make a trigram. Eight of them name the basic pictures: Heaven, Earth, Thunder, Wind, Water, Fire, Mountain, Lake. A hexagram is two trigrams, lower then upper."],
["Six lines","Six lines, bottom first, make a hexagram. There are 64. The lower three lines are the inner picture. The upper three are the outer picture."],
["How to cast","Use three coins. Heads counts 3, tails counts 2. Add them. 6 is a changing yin line. 7 is a stable yang line. 8 is a stable yin line. 9 is a changing yang line. Throw six times, bottom line first."],
["How to read","Read the name and the short picture first. If a line is 6 or 9, it is changing: read that line, then flip it. Flipping the changing lines makes a second hexagram, the direction things are moving. Stable lines stay as they are."],
["Practice","Ask one question you can act on. Cast. Read the first picture, then only the changing lines, then the second picture. Write one sentence: what this asks of me today."]

 return "<div class='bars'>"+[...bits].map((b,i)=>{
  const c=ch&&ch[i]?" chg":"";
  return b==="1"?"<div class='bar"+c+"'></div>":"<div class='bar yin"+c+"'><i></i><i></i></div>";
 }).join("")+"</div>";
}
function showLesson(){
 const [t,b]=lessons[lessonAt];
 let extra="";
 if(lessonAt===2) extra="<div class='tri'>"+trigrams.map(t=>"<div><strong>"+t[0]+"</strong><br>"+t[1]+"<br><span class='muted'>"+t[2]+"</span></div>").join("")+"</div>";
 if(lessonAt===3) extra=bars("101010")+"<p class='muted'>Example: solid, broken, solid, broken, solid, broken. Bottom line is the first one you cast.</p>";
 $("#lesson").innerHTML="<p class='muted'>Lesson "+(lessonAt+1)+" of 7</p><h2>"+t+"</h2><p>"+b+"</p>"+extra;
 $("#next").textContent=lessonAt===6?"Start again":"Next";
}
function tab(name){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
 ["learn","cast","book"].forEach(id=>$("#"+id).classList.toggle("hide", id!==name));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$("#next").onclick=()=>{ lessonAt=(lessonAt+1)%7; showLesson(); };
function coin(){ return Math.random()<0.5?3:2; }
function drawCoins(vals){
 $("#coins").innerHTML=vals.map(v=>"<div class='coin "+(v===3?"h":"t")+"'>"+(v===3?"H":"T")+"</div>").join("");
}
function renderReading(){
 if(casts.length<6){ $("#reading").innerHTML=""; return; }
 const bits=casts.map(c=> (c===7||c===9)?"1":"0").join("");
 const ch=casts.map(c=>c===6||c===9);
 const idx=lines.indexOf(bits);
 const rel=bits.split("").map((b,i)=>ch[i]?(b==="1"?"0":"1"):b).join("");
 const idx2=lines.indexOf(rel);
 const h=idx>=0?hex[idx]:null, h2=idx2>=0?hex[idx2]:null;
 let html="<h2>"+(h?(idx+1)+". "+h[0]+" — "+h[1]:"Unknown figure")+"</h2>"+bars(bits,ch);
 html+="<p>"+(h?h[2]:"")+"</p><ol>"+casts.map((c,i)=>"<li>Line "+(i+1)+": "+c+(c===6||c===9?" changing":" stable")+"</li>").join("")+"</ol>";
 if(ch.some(Boolean)&&h2) html+="<h2>Moving toward "+(idx2+1)+". "+h2[0]+" — "+h2[1]+"</h2>"+bars(rel)+"<p>"+h2[2]+"</p>";
 else if(!ch.some(Boolean)) html+="<p class='muted'>No changing lines. Read this picture only.</p>";
 $("#reading").innerHTML=html;
}
$("#throw").onclick=()=>{
 if(casts.length>=6) return;
 const vals=[coin(),coin(),coin()];
 drawCoins(vals);
 casts.push(vals.reduce((a,b)=>a+b,0));
 $("#thrown").textContent=casts.length<6?("Throw "+(casts.length+1)+" of 6"):"Done";
 renderReading();
};
$("#reset").onclick=()=>{ casts=[]; $("#coins").innerHTML=""; $("#thrown").textContent="Throw 1 of 6 — bottom line"; $("#reading").innerHTML=""; };
const pick=$("#pick");
hex.forEach((h,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=(i+1)+". "+h[0]+" — "+h[1]; pick.appendChild(o); });
function showEntry(){ const i=+pick.value; const h=hex[i]; $("#entry").innerHTML=bars(lines[i])+"<p><strong>"+h[0]+"</strong> — "+h[1]+"</p><p>"+h[2]+"</p><p class='muted'>Lines, bottom to top: "+lines[i].replace(/1/g,"solid ").replace(/0/g,"broken ")+"</p>"; }
pick.onchange=showEntry;
showLesson(); showEntry();
</script>
</body>
