name: assemble-hero
on: workflow_dispatch
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single-file index.html
        run: |
          python3 << 'PY'
          import base64, shutil
          from pathlib import Path
          root = Path('.hero-chunks')
          pre = base64.b64decode((root/'pre.b64').read_text())
          b64 = ''.join((root/f'c{i:02d}.txt').read_text() for i in range(32)).encode()
          sufb = ''.join((root/f's{i:02d}.txt').read_text() for i in range(8))
          suf = base64.b64decode(sufb)
          Path('index.html').write_bytes(pre + b64 + suf)
          shutil.rmtree(root)
          Path('.github/workflows/assemble-hero.yml').unlink()
          PY
      - name: Commit and push
        run: |
          git config user.name "justjude34-ship-it"
          git config user.email "justjude34@gmail.com"
          git add -A
          git commit -m "Add gold yin-yang hero banner"
          git push
