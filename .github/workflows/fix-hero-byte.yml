name: fix-hero-byte
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop the extra base64 byte
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          b = p.read_bytes()
          assert b[32640:32655] == b'vn6TKK5B/KBnYHA', b[32640:32670]
          assert b[32655:32656] == b'n'
          assert b[32656:32670] == b'th3BxMqtX+Lnzi'
          fixed = b[:32655] + b[32656:]
          assert len(fixed) == 90915
          p.write_bytes(fixed)
          Path('.github/workflows/fix-hero-byte.yml').unlink()
          PY
      - name: Commit and push
        run: |
          git config user.name "justjude34-ship-it"
          git config user.email "justjude34@gmail.com"
          git add -A
          git commit -m "Remove extra byte in hero image data"
          git push
