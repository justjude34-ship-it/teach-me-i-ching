name: fix-hero-byte
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop the extra base64 byte
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          b = p.read_bytes()
          ctx = b[32640:32670]
          assert ctx == b'vn6TKK5B/KBnYHAnth3BxMqtX+Ln', ctx
          assert b[32655:32656] == b'n'
          p.write_bytes(b[:32655] + b[32656:])
          Path('.github/workflows/fix-hero-byte.yml').unlink()
          PY
      - name: Commit and push
        run: |
          git config user.name "justjude34-ship-it"
          git config user.email "justjude34@gmail.com"
          git add -A
          git commit -m "Add gold yin-yang hero banner"
          git push
